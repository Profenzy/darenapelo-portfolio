<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="70%" stop-color="#0e0e10"/>
      <stop offset="100%" stop-color="#060607"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="25%" stop-color="#e5c07b"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="85%" stop-color="#aa8620"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <!-- Gold Accent Stroke Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c07b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#aa8620" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldBorder)" stroke-width="6"/>

  <!-- Inner Subtle Accent Ring -->
  <rect x="32" y="32" width="448" height="448" rx="98" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="8 8"/>

  <!-- Stylized Emblem: Monogram "D" + Cinematic Play Wedge -->
  <g filter="url(#goldGlow)" transform="translate(10, 0)">
    <!-- Vertical Spine of the D -->
    <rect x="136" y="136" width="42" height="240" rx="12" fill="url(#goldMetallic)"/>

    <!-- Dynamic Curved Play Arc of the D -->
    <path d="M 178 136 
             L 260 136 
             C 340 136 386 186 386 256 
             C 386 326 340 376 260 376 
             L 178 376 
             Z" 
          fill="none" 
          stroke="url(#goldMetallic)" 
          stroke-width="42" 
          stroke-linejoin="round"/>

    <!-- Central Play Chevron (represents Motion / Editing) -->
    <polygon points="230,204 306,256 230,308" fill="url(#goldMetallic)"/>
  </g>
</svg>
